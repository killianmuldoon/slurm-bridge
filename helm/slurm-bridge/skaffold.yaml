# https://skaffold.dev/docs/references/yaml/
apiVersion: skaffold/v4beta1
kind: Config
build:
  artifacts:
    - image: slinky.slurm.net/slurm-bridge-scheduler
      context: ../../
      docker:
        dockerfile: Dockerfile
        target: scheduler
    - image: slinky.slurm.net/slurm-bridge-admission
      context: ../../
      docker:
        dockerfile: Dockerfile
        target: admission
    - image: slinky.slurm.net/slurm-bridge-controllers
      context: ../../
      docker:
        dockerfile: Dockerfile
        target: controllers
  tagPolicy:
    inputDigest: {}
  local:
    useDockerCLI: true
    push: false
deploy:
  helm:
    releases:
      - name: slurm-bridge
        chartPath: ./
        valuesFiles:
          - ./values-dev.yaml
        setValueTemplates:
          scheduler.image.repository: '{{.IMAGE_REPO_slinky_slurm_net_slurm_bridge_scheduler}}'
          scheduler.image.tag: '{{.IMAGE_TAG_slinky_slurm_net_slurm_bridge_scheduler}}'
          admission.image.repository: '{{.IMAGE_REPO_slinky_slurm_net_slurm_bridge_admission}}'
          admission.image.tag: '{{.IMAGE_TAG_slinky_slurm_net_slurm_bridge_admission}}'
          controllers.image.repository: '{{.IMAGE_REPO_slinky_slurm_net_slurm_bridge_controllers}}'
          controllers.image.tag: '{{.IMAGE_TAG_slinky_slurm_net_slurm_bridge_controllers}}'
        namespace: slinky
        createNamespace: true
# Debug profile patches depend on base artifact order:
# 0=scheduler, 1=admission, 2=controllers.
# Run `make debug-validate` after changing build.artifacts.
profiles:
  - name: remote
    patches:
      - op: replace
        path: /build/local/push
        value: true
  - name: debug
    patches:
      - op: replace
        path: /build/artifacts/0/docker/target
        value: scheduler-debug
      - op: replace
        path: /build/artifacts/1/docker/target
        value: admission-debug
      - op: replace
        path: /build/artifacts/2/docker/target
        value: controllers-debug
      - op: add
        path: /build/artifacts/0/sync
        value:
          manual: &debug-file-sync-rules
            - src: "**/*.go"
              dest: /tmp/skaffold-sync/
            - src: go.mod
              dest: /tmp/skaffold-sync/
            - src: go.sum
              dest: /tmp/skaffold-sync/
          hooks:
            before:
              - host:
                  command:
                    - ./hack/debug/build-binary.sh
                    - scheduler
                  dir: &debug-hook-dir ../..
            after:
              - host:
                  command:
                    - ./hack/debug/copy-and-sighup.sh
                    - scheduler
                  dir: *debug-hook-dir
      - op: add
        path: /build/artifacts/1/sync
        value:
          manual: *debug-file-sync-rules
          hooks:
            before:
              - host:
                  command:
                    - ./hack/debug/build-binary.sh
                    - admission
                  dir: *debug-hook-dir
            after:
              - host:
                  command:
                    - ./hack/debug/copy-and-sighup.sh
                    - admission
                  dir: *debug-hook-dir
      - op: add
        path: /build/artifacts/2/sync
        value:
          manual: *debug-file-sync-rules
          hooks:
            before:
              - host:
                  command:
                    - ./hack/debug/build-binary.sh
                    - controllers
                  dir: *debug-hook-dir
            after:
              - host:
                  command:
                    - ./hack/debug/copy-and-sighup.sh
                    - controllers
                  dir: *debug-hook-dir
      - op: add
        path: /deploy/helm/flags
        value:
          install:
            - --post-renderer=../../hack/debug/helm-post-renderer.sh
          template:
            - --post-renderer=../../hack/debug/helm-post-renderer.sh
          upgrade:
            - --post-renderer=../../hack/debug/helm-post-renderer.sh
      - op: add
        path: /portForward
        value:
          - resourceType: deployment
            resourceName: slurm-bridge-scheduler
            namespace: slinky
            port: 40000
            localPort: 40000
          - resourceType: deployment
            resourceName: slurm-bridge-controllers
            namespace: slinky
            port: 40001
            localPort: 40001
          - resourceType: deployment
            resourceName: slurm-bridge-admission
            namespace: slinky
            port: 40002
            localPort: 40002
