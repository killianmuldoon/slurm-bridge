# This overlay is copied into a temporary directory by helm-post-renderer.sh.
# rendered.yaml is the Helm output; the patches convert the three deployments
# into Delve reload targets for the Skaffold debug dev loop.
resources:
  - rendered.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: slurm-bridge-scheduler
    path: patches/scheduler-debug.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: slurm-bridge-controllers
    path: patches/controllers-debug.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: slurm-bridge-admission
    path: patches/admission-debug.yaml
